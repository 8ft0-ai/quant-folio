name: Quant Folio research
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish report and state (requires owner activation)
        type: boolean
        default: false
  schedule:
    - cron: '17 1 * * 1' # Mondays 01:17 UTC; 12:17 AEDT / 11:17 AEST
permissions:
  contents: read
concurrency:
  group: quant-folio-publication
  cancel-in-progress: false
jobs:
  pilot:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python -m unittest discover -s tests -v
      - name: Non-publishing real-service pilot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.QUANT_FOLIO_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
        run: python curate.py --reports /tmp/quant-folio-reports --state /tmp/quant-folio-seen.json
      - uses: actions/upload-artifact@v4
        with:
          name: quant-folio-pilot
          path: /tmp/quant-folio-reports/*.md
          retention-days: 14
  publish:
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref == 'refs/heads/main' && vars.QUANT_FOLIO_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python -m unittest discover -s tests -v
      - name: Assess and render
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.QUANT_FOLIO_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
        run: python curate.py
      - name: Atomic publication of digest and state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -s data/seen.json
          test -s "reports/$(date -u +%F).md"
          git add -- reports/ data/seen.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Quant Folio digest'
          git push origin HEAD:main
