name: Generate reading list (manual pilot)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate report in temporary workspace
        run: python scout.py --reports /tmp/quant-folio-report --state /tmp/quant-folio-state.json
      - name: Upload report for inspection (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: quant-folio-pilot
          path: /tmp/quant-folio-report/*.md
          retention-days: 14
