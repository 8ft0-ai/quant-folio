name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # validate pinned source commit/tree/blob offline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scout.py --fixture tests/fixture.atom --today 2026-10-24 --state /tmp/quant-folio-seen.json --reports /tmp/quant-folio-reports
      - run: test -s /tmp/quant-folio-reports/2026-10-24.md
