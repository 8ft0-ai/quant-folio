name: Quant Folio operational acceptance
on:
  push:
    branches:
      - acceptance/three-run-operational
  workflow_dispatch:
# Acceptance only. No schedule, publication, repository writes, or paid fallback.
permissions:
  contents: read
concurrency:
  group: quant-folio-three-run-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Three non-publishing acceptance scenarios
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          PYTHONPATH: .
          ACCEPTANCE_DIR: ${{ runner.temp }}/quant-folio-acceptance
        run: python tests/operational_acceptance.py
      - name: Upload acceptance evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-folio-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/quant-folio-acceptance/
          if-no-files-found: warn
          retention-days: 14
